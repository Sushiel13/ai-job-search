# Scheduled job search: runs /scrape then /rank headlessly with Claude Code and
# publishes the ranked shortlist as the run summary and a downloadable artifact.
#
# Setup (once):
#   1. Personalize the profile first (/setup locally, then commit CLAUDE.md,
#      .claude/skills/** and search-queries.md). The run refuses to start while
#      CLAUDE.md still holds the [YOUR_NAME] placeholder.
#   2. Add ONE auth secret (Settings > Secrets and variables > Actions):
#        ANTHROPIC_API_KEY        - pay-per-use API key, or
#        CLAUDE_CODE_OAUTH_TOKEN  - Pro/Max subscription token from `claude setup-token`
#   3. Optional repository variables: CI_PORTALS (comma list of portal skills to
#      run, default "freehire-search"), CLAUDE_MODEL (default "sonnet").
#
# Portals: LinkedIn is never run here. Its skill is personal-use only and the
# upstream CI explicitly keeps automated requests out of Actions; /scrape
# covers LinkedIn-indexed postings through its WebSearch fallback instead.
# Run linkedin-search locally if you want it.
#
# State: job_scraper/seen_jobs.json and job_search_tracker.csv are gitignored
# personal data, so dedup history is carried between runs in the Actions cache,
# never committed. Each run restores the newest cache and saves a fresh one.
#
# Privacy: on a PUBLIC repo, run summaries and artifacts are visible to other
# GitHub users. Keep this fork private if the shortlist should stay private.
#
# Security: read-only token, credentials not persisted, Claude Code limited to
# the repo's own allow-list in .claude/settings.json plus file/web tools - no
# free-form Bash, so posting text (untrusted input) cannot run commands.

name: Scheduled job search

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily = 07:47 IST
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus area for /scrape and /rank (e.g. 'devops dubai'). Blank = default categories."
        required: false
        default: ""
      broad:
        description: "Run all search-query categories (/scrape broad)"
        type: boolean
        default: false
      rank_limit:
        description: "Max jobs to score this run"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    name: Scrape and rank jobs
    # Never on the upstream template; it has no candidate profile.
    if: github.repository != 'ai-job-search-dev/ai-job-search'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_PORTALS: ${{ vars.CI_PORTALS || 'freehire-search' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
      FOCUS: ${{ inputs.focus }}
      BROAD: ${{ inputs.broad }}
      RANK_LIMIT: ${{ inputs.rank_limit || '15' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check the profile is personalized
        run: |
          if grep -q '\[YOUR_NAME\]' CLAUDE.md; then
            echo "::error::CLAUDE.md still has [YOUR_NAME]. Run /setup locally and commit your profile before enabling this workflow."
            exit 1
          fi

      - name: Pick auth secret
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          elif [ -n "$OAUTH" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN=$OAUTH" >> "$GITHUB_ENV"
          else
            echo "::error::Add an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install tools
        run: |
          python3 tools/install_portal_clis.py
          python3 -m pip install --quiet pypdf
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Enable only CI-safe portals
        # Edits the runner's working copy only; nothing is committed.
        run: |
          for skill in .agents/skills/*/SKILL.md; do
            name="$(basename "$(dirname "$skill")")"
            if [ "$name" = "linkedin-search" ]; then
              state=false
            elif printf ',%s,' "$CI_PORTALS" | grep -q ",$name,"; then
              state=true
            else
              state=false
            fi
            sed -i -E "s/^enabled:[[:space:]]*(true|false)/enabled: $state/" "$skill"
            echo "$name -> enabled: $state"
          done

      - name: Restore search history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            job_scraper/seen_jobs.json
            job_search_tracker.csv
          key: job-search-state-${{ github.run_id }}
          restore-keys: job-search-state-

      - name: Run /scrape
        run: |
          mkdir -p reports
          args=""
          [ "$BROAD" = "true" ] && args="broad"
          [ -n "$FOCUS" ] && args="$args $FOCUS"
          claude -p "/scrape $args. This is an unattended scheduled run: nobody can answer questions, so never ask - take the most reasonable default and note it in the summary. Write temporary files under $RUNNER_TEMP." \
            --model "$CLAUDE_MODEL" \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --add-dir "$RUNNER_TEMP" \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" "WebFetch" "WebSearch" "Agent" "Skill" "Bash(bun --version)" \
            --disallowedTools "AskUserQuestion" \
            | tee reports/scrape.md

      - name: Run /rank
        run: |
          claude -p "/rank --limit $RANK_LIMIT --top 10 $FOCUS. This is an unattended scheduled run: never ask questions; take the default and note it." \
            --model "$CLAUDE_MODEL" \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --add-dir "$RUNNER_TEMP" \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" "WebFetch" "WebSearch" "Agent" "Skill" \
            --disallowedTools "AskUserQuestion" \
            | tee reports/rank.md

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Job search $(date -u +%F)"
            [ -f reports/rank.md ] && { echo "## Ranked shortlist"; cat reports/rank.md; }
            [ -f reports/scrape.md ] && { echo; echo "## New postings"; cat reports/scrape.md; }
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f job_scraper/seen_jobs.json ] && cp job_scraper/seen_jobs.json reports/ || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-search-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Save search history
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            job_scraper/seen_jobs.json
            job_search_tracker.csv
          key: job-search-state-${{ github.run_id }}
